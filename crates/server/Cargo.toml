[package]
name = "orbit-server"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
unbought-auth.workspace = true
orbit-engine.workspace = true
orbit-application.workspace = true
orbit-storage-postgres.workspace = true
orbit-transport-http.workspace = true
tokio.workspace = true
axum.workspace = true
uuid = { workspace = true, features = ["v4"] }
serde_json.workspace = true
serde.workspace = true
sha2.workspace = true
hex.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
test-support = ["orbit-storage-postgres/test-support"]
universe-config-bridge = []
