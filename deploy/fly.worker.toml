# orbit-production-ha-required
# No public service. Set FLY_APP explicitly; verify at least two worker Machines.
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 45
[build]
  dockerfile = "../Dockerfile"
[deploy]
  strategy = "rolling"
[env]
  ORBIT_ROLE = "worker"
  ORBIT_METRICS_BIND = "0.0.0.0:9091"
  ORBIT_POOL_ADMISSION = "0"
  ORBIT_POOL_READS = "0"
  ORBIT_POOL_WORKER = "4"
  ORBIT_POOL_CONTROL = "4"
  ORBIT_CPU_WORKERS = "2"
  ORBIT_MAX_IN_FLIGHT = "4"
  ORBIT_DRAIN_MS = "25000"
[checks.worker]
  type = "http"
  port = 9091
  method = "GET"
  path = "/health/ready"
  grace_period = "10s"
  interval = "5s"
  timeout = "3s"
[metrics]
  port = 9091
  path = "/metrics"
[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory = "2gb"
