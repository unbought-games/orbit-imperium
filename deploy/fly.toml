# Supply the dedicated app with --app / FLY_APP. No unrelated default app.
primary_region = "ewr"
kill_signal = "SIGINT"
kill_timeout = "45s"
[build]
  dockerfile = "../Dockerfile"
[env]
  ORBIT_ROLE = "combined"
  ORBIT_POOL_ADMISSION = "4"
  ORBIT_POOL_READS = "4"
  ORBIT_POOL_WORKER = "2"
  ORBIT_POOL_CONTROL = "3"
  ORBIT_MAX_IN_FLIGHT = "2"
  ORBIT_CPU_WORKERS = "1"
  ORBIT_BIND = "0.0.0.0:8080"
  ORBIT_ASSETS = "/app/web"
  ORBIT_TRUSTED_FLY_PROXIES = "172.19.0.129"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1
  [[http_service.checks]]
    grace_period = "60s"
    interval = "15s"
    method = "GET"
    path = "/health/ready"
    timeout = "3s"
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
