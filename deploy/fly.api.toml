# orbit-production-ha-required
# Starting configuration, not measured capacity. Set FLY_APP explicitly.
primary_region = "ewr"
kill_signal = "SIGTERM"
kill_timeout = 45
[build]
  dockerfile = "../Dockerfile"
[deploy]
  strategy = "rolling"
[env]
  # Set ORBIT_ORIGIN=https://<public-host> via the app environment/secrets.
  # TLS terminates at Fly; internal HTTP still uses Secure browser cookies.
  ORBIT_ROLE = "api"
  ORBIT_BIND = "0.0.0.0:8080"
  ORBIT_METRICS_BIND = "0.0.0.0:9091"
  ORBIT_ASSETS = "/app/web"
  ORBIT_POOL_ADMISSION = "8"
  ORBIT_POOL_READS = "8"
  ORBIT_POOL_WORKER = "0"
  ORBIT_POOL_CONTROL = "4"
  ORBIT_DRAIN_MS = "25000"
  ORBIT_TRUSTED_FLY_PROXIES = "172.19.0.129"
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 2
  [[http_service.checks]]
    grace_period = "10s"
    interval = "5s"
    method = "GET"
    path = "/health/ready"
    timeout = "3s"
[metrics]
  port = 9091
  path = "/metrics"
[[vm]]
  cpu_kind = "performance"
  cpus = 2
  memory = "2gb"
