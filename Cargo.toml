[workspace]
members = ["crates/engine", "crates/application", "crates/storage-postgres", "crates/transport-http", "crates/server", "crates/storage-assets"]
resolver = "3"

# Keep source locations in test backtraces without full workspace type/variable
# debug information. Named overrides leave dependency and build-script profiles
# unchanged, so existing CI dependency artifacts remain reusable.
[profile.test.package.orbit-engine]
debug = "line-tables-only"

[profile.test.package.orbit-application]
debug = "line-tables-only"

[profile.test.package.orbit-storage-postgres]
debug = "line-tables-only"

[profile.test.package.orbit-transport-http]
debug = "line-tables-only"

[profile.test.package.orbit-server]
debug = "line-tables-only"

[workspace.package]
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"

[workspace.dependencies]
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
orbit-engine = { path = "crates/engine" }
orbit-application = { path = "crates/application" }
orbit-storage-postgres = { path = "crates/storage-postgres" }
orbit-transport-http = { path = "crates/transport-http" }
orbit-storage-assets = { path = "crates/storage-assets" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
uuid = { version = "=1.18.1", features = ["serde"] }
sha2 = "=0.10.9"
hex = "=0.4.3"
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["full"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "json", "migrate", "macros"] }
argon2 = "=0.5.3"
rand = "=0.8.5"
axum = "=0.8.6"
tower-http = { version = "=0.6.11", features = ["fs", "trace", "limit"] }
num-bigint = "=0.4.6"
num-rational = "=0.4.2"
num-traits = "=0.2.19"
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
hmac = "=0.12.1"

# Public versioned account contract; independent of a sibling checkout.
unbought-auth = "=0.2.1"
