name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: 'true'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Keep source backtraces without duplicating dependency type/variable debug data
  # in every test binary. These CARGO values also partition the Rust cache.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  scope:
    name: Select integration tests
    runs-on: ubuntu-24.04
    outputs:
      database: ${{ steps.integration.outputs.database }}
      ui: ${{ steps.integration.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select relevant integration tests
        id: integration
        env:
          # A queue group can contain several PRs; include all of their changes.
          BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha || github.event.before }}
        run: |
          database=false
          ui=false
          if [ -z "$BASE_SHA" ] || ! git diff --name-only "$BASE_SHA...HEAD" > "$RUNNER_TEMP/changed-paths"; then
            database=true
            ui=true
          else
            while IFS= read -r path; do
              case "$path" in
                docs/*|.agents/*|*.md) ;;
                apps/web/*) ui=true ;;
                *) database=true; ui=true ;;
              esac
            done < "$RUNNER_TEMP/changed-paths"
          fi
          echo "database=$database" >> "$GITHUB_OUTPUT"
          echo "ui=$ui" >> "$GITHUB_OUTPUT"

  native:
    name: Build, lint and unit checks
    needs: scope
    # PR code must run on a fresh GitHub-hosted VM, never a persistent host.
    runs-on: ubuntu-24.04
    # No custom execution deadline; GitHub retains its six-hour platform cap.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm and dependencies
        run: |
          npm install --global "npm@$(node --print 'require("./package.json").engines.npm')"
          npm ci
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          # Share main dependencies built with the same debug profile.
          shared-key: check-native
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.114
      - name: Run checks
        run: make check
      - name: Report Rust build disk usage
        if: always()
        run: |
          df -h .
          for path in target "$HOME/.cargo"; do
            if [ -d "$path" ]; then du -sh "$path"; fi
          done
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock package-lock.json

  database:
    name: PostgreSQL tests (${{ matrix.group }})
    needs: scope
    if: needs.scope.outputs.database == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [rules, world, rest]
    env:
      COMPOSE_PROJECT_NAME: orbit-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
      ORBIT_DB_PUBLISHED_PORT: '0'
      # Four simultaneous cold-schema migrations exhausted the functional startup
      # deadline on shared runners. Bound database pressure without relaxing it.
      DB_JOBS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@63fed3e2fecf6f7b51dc6f043341b79ef82a9ae7 # v2.9.2
        with:
          # Share main dependencies built with the same debug profile.
          shared-key: check-native
          cache-bin: false
          save-if: false
      - name: Install pinned nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.114
      - name: Start disposable PostgreSQL
        run: |
          make db-up
          address=$(docker compose port db 5432)
          echo "ORBIT_TEST_DB_PORT=${address##*:}" >> "$GITHUB_ENV"
      # Make runs isolated database binaries with its bounded parallelism.
      - name: Run PostgreSQL integration tests
        run: make test-db-${{ matrix.group }}
      - name: Report Rust build disk usage
        if: always()
        run: |
          df -h .
          for path in target "$HOME/.cargo"; do
            if [ -d "$path" ]; then du -sh "$path"; fi
          done
      - name: Remove disposable database and test files
        if: always()
        run: |
          bash -e <<'CLEANUP'
          docker compose down --volumes --remove-orphans
          rm -rf .secrets
          CLEANUP
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock package-lock.json

  browser:
    name: Browser tests (${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: scope
    if: needs.scope.outputs.ui == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - { suite: journeys, shard: 1, shards: 1 }
          - { suite: components, shard: 1, shards: 1 }
          # Keep unmigrated feature interactions required until their replacements pass.
          - { suite: features, shard: 1, shards: 6 }
          - { suite: features, shard: 2, shards: 6 }
          - { suite: features, shard: 3, shards: 6 }
          - { suite: features, shard: 4, shards: 6 }
          - { suite: features, shard: 5, shards: 6 }
          - { suite: features, shard: 6, shards: 6 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install pinned npm and dependencies
        run: |
          npm install --global "npm@$(node --print 'require("./package.json").engines.npm')"
          npm ci
      # Bypass intermittent Azure archive stalls: actions/runner-images#14823.
      - name: Use Ubuntu archive mirrors
        run: |
          # apt requires a literal tab between the URI and priority metadata.
          printf '%s\tpriority:%s\n' \
            'https://archive.ubuntu.com/ubuntu' 0 \
            'https://security.ubuntu.com/ubuntu' 1 \
            | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify prerendered homepage production assets
        if: matrix.suite == 'journeys'
        run: make test-homepage-built
      - name: Run selected browser boundary
        env:
          UI_SHARD: ${{ matrix.shard }}/${{ matrix.shards }}
          BROWSER_SUITE: ${{ matrix.suite }}
        run: |
          if [ "$BROWSER_SUITE" = components ]; then
            make test-components
          else
            ORBIT_BROWSER_SUITE="$BROWSER_SUITE" make test-ui
          fi
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.suite }}-${{ matrix.shard }}
          path: |
            test-results/browser-ui/
            test-results/browser-homepage/
            test-results/components/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify lockfiles remain unchanged
        if: always()
        run: git diff --exit-code -- Cargo.lock package-lock.json

  check:
    # Preserve the required-check name while covering all independent jobs.
    name: Build, lint and unit tests
    needs: [scope, native, database, browser]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require all selected checks to pass
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
          DATABASE_SELECTED: ${{ needs.scope.outputs.database }}
          DATABASE_RESULT: ${{ needs.database.result }}
          UI_SELECTED: ${{ needs.scope.outputs.ui }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$NATIVE_RESULT" = success
          case "$DATABASE_SELECTED:$DATABASE_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
          case "$UI_SELECTED:$BROWSER_RESULT" in
            true:success|false:skipped) ;;
            *) exit 1 ;;
          esac
