name: TC-011 disk comparison

# Temporary branch-only experiment; removed before the repair PR.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  compare:
    name: PostgreSQL rest (${{ matrix.debug }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        debug: [baseline, line-tables-only]
    env:
      COMPOSE_PROJECT_NAME: orbit-tc011-${{ github.run_id }}-${{ matrix.debug }}
      ORBIT_DB_PUBLISHED_PORT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - run: rustup show active-toolchain
      - name: Select candidate debug information
        if: matrix.debug == 'line-tables-only'
        run: |
          echo CARGO_PROFILE_DEV_DEBUG=line-tables-only >> "$GITHUB_ENV"
          echo CARGO_PROFILE_TEST_DEBUG=line-tables-only >> "$GITHUB_ENV"
      - name: Measure initial disk
        run: |
          df -B1 .
          df -i .
          du -sk "$HOME/.cargo" target 2>/dev/null || true
          docker system df
      # Both variants start cold; cached artifacts cannot bias the comparison.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283
        with:
          tool: cargo-nextest@0.9.114
      - name: Start disposable PostgreSQL
        run: |
          make db-up
          address=$(docker compose port db 5432)
          echo "ORBIT_TEST_DB_PORT=${address##*:}" >> "$GITHUB_ENV"
      - name: Run existing rest suite
        run: make test-db-rest
      - name: Measure build footprint
        if: always()
        run: |
          df -B1 .
          df -i .
          du -sk target target/debug/deps target/debug/build "$HOME/.cargo" /tmp "$RUNNER_TEMP" 2>/dev/null || true
          find target/debug/deps -maxdepth 1 -type f -printf '%s %f\n' | sort -nr | head -40 || true
          docker system df
      - name: Remove disposable database and test files
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          rm -rf .secrets
