name: Release image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main, prod/S001]

  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch containing the selected commit and its successful push CI
        type: choice
        options: [main, prod/S001]
        default: main
      commit:
        description: Full commit SHA on the selected source branch
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-image-${{ inputs.source_branch || github.event.workflow_run.head_branch }}-${{ inputs.commit || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  trusted:
    if: >-
      github.repository_id == '1427640162' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.id == 1427640162))
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.verify.outputs.sha }}
      source_branch: ${{ steps.verify.outputs.source_branch }}
      ci_run: ${{ steps.verify.outputs.ci_run }}
      ci_attempt: ${{ steps.verify.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify source branch, selected commit and exact successful CI
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs

  build:
    needs: trusted
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ORBIT_RELEASE_SHA: ${{ needs.trusted.outputs.sha }}
      ORBIT_RELEASE_IMAGE: orbit-release:${{ needs.trusted.outputs.sha }}
    outputs:
      image_artifact: ${{ steps.save.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.trusted.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Build release once
        run: |
          test "$(git rev-parse HEAD)" = "$ORBIT_RELEASE_SHA"
          make release-image
      - name: Inspect source and notices in the built image
        run: make inspect-release-image
      - name: Export the inspected image
        run: docker save "$ORBIT_RELEASE_IMAGE" | gzip -1 > "$RUNNER_TEMP/image.tar.gz"
      - name: Retain the image for the publisher
        id: save
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-layers-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish:
    needs: [trusted, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_PUBLISH_ROLE_ARN: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
      ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}
      ORBIT_CI_RUN_ID: ${{ needs.trusted.outputs.ci_run }}
      ORBIT_CI_RUN_ATTEMPT: ${{ needs.trusted.outputs.ci_attempt }}
      ORBIT_RELEASE_SHA: ${{ needs.trusted.outputs.sha }}
      ORBIT_SOURCE_BRANCH: ${{ needs.trusted.outputs.source_branch }}
      ORBIT_RELEASE_IMAGE: orbit-release:${{ needs.trusted.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.image_artifact }}
          path: ${{ runner.temp }}/built-image
          merge-multiple: true
      - name: Load inspected image and verify its identity
        run: |
          docker load --input "$RUNNER_TEMP/built-image/image.tar.gz"
          test "$(docker inspect --type=image --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$ORBIT_RELEASE_IMAGE")" = "$ORBIT_RELEASE_SHA"
          test "$(docker inspect --type=image --format '{{.Os}}/{{.Architecture}}' "$ORBIT_RELEASE_IMAGE")" = linux/amd64
          test "$AWS_REGION" = us-east-2
          [[ "$AWS_PUBLISH_ROLE_ARN" =~ ^arn:aws:iam::888782969020:role/.+ ]]
          test "$ECR_REPOSITORY_URL" = 888782969020.dkr.ecr.us-east-2.amazonaws.com/unbought/orbit-imperium
      - name: Recheck source ancestry and pinned CI before obtaining AWS credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-gate.mjs
      - name: Assume scoped publication role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '888782969020'
          role-session-name: orbit-image-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 900
          unset-current-credentials: true
      - name: Publish immutable image and record digest
        env:
          CI_RUN_ID: ${{ needs.trusted.outputs.ci_run }}
          CI_RUN_ATTEMPT: ${{ needs.trusted.outputs.ci_attempt }}
        run: |
          registry="${ECR_REPOSITORY_URL%%/*}"
          repository="${ECR_REPOSITORY_URL#*/}"
          tag="sha-${ORBIT_RELEASE_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${ORBIT_SOURCE_BRANCH//\//-}"
          export DOCKER_CONFIG="$RUNNER_TEMP/release-docker"
          mkdir -p "$DOCKER_CONFIG"
          trap 'docker logout "$registry"; rm -rf "$DOCKER_CONFIG"' EXIT
          aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
          docker tag "$ORBIT_RELEASE_IMAGE" "$ECR_REPOSITORY_URL:$tag"
          docker push "$ECR_REPOSITORY_URL:$tag"
          digest=$(aws ecr describe-images --repository-name "$repository" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          jq -n --arg commit "$ORBIT_RELEASE_SHA" --arg image "$ECR_REPOSITORY_URL@$digest" \
            --arg source_branch "$ORBIT_SOURCE_BRANCH" --arg tag "$tag" --arg ci_run "$CI_RUN_ID" --arg ci_attempt "$CI_RUN_ATTEMPT" \
            --arg release_run "$GITHUB_RUN_ID" --arg release_attempt "$GITHUB_RUN_ATTEMPT" --arg publisher_commit "$GITHUB_SHA" \
            '{commit: $commit, source_branch: $source_branch, image: $image, tag: $tag, platform: "linux/amd64", ci_run: $ci_run, ci_attempt: $ci_attempt, release_run: $release_run, release_attempt: $release_attempt, publisher_commit: $publisher_commit}' > release-image.json
          cat release-image.json >> "$GITHUB_STEP_SUMMARY"
      - name: Save commit and digest record
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-image-${{ needs.trusted.outputs.sha }}-${{ github.run_attempt }}
          path: release-image.json
          if-no-files-found: error
          retention-days: 90
